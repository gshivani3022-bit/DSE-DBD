# ACTIVITY SERVICE CONFIGURATION | Port 8083 | Stores Recent Activity in activity_service_db.
# Set DB_PASSWORD in the environment; the service defaults to fileversion_user, never root.
server.port=8083
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${ACTIVITY_DB_NAME:activity_service_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:fileversion_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
